name: TN Happy Kids Playschool - Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: false
          eas-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build Android APK (Expo CLI)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🚀 Building Android APK with Expo CLI..."
          npx expo build:android --type apk --non-interactive --no-wait
          echo "✅ Expo build command executed"
          
          # Wait a moment for build to start
          sleep 10
          
          # Get build status
          npx expo build:list --platform android --limit 1 --json > build_status.json
          BUILD_ID=$(cat build_status.json | jq -r '.[0].id')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          
          echo "⏳ Build started with ID: $BUILD_ID"
          echo "📱 Monitor build status at: https://expo.dev/builds"

      - name: Create Release (if on main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: TN Happy Kids Playschool v${{ github.run_number }}
          body: |
            🎉 **TN Happy Kids Playschool - Release v${{ github.run_number }}**
            
            📱 **What's New:**
            - Latest features and bug fixes
            - Enhanced UI/UX improvements
            - Performance optimizations
            
            📥 **Download:**
            - Android APK available in artifacts
            
            🔧 **Built with:**
            - React Native + Expo
            - GitHub Actions CI/CD
            
            📅 **Build Date:** ${{ github.event.head_commit.timestamp }}
            📝 **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
