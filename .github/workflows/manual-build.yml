name: 🔧 Manual Build & Export

on:
  workflow_dispatch:
    inputs:
      export_type:
        description: 'Export Type'
        required: true
        default: 'all'
        type: choice
        options:
        - web-only
        - android-only
        - ios-only
        - all
      build_profile:
        description: 'Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
        - development
        - preview
        - production
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  manual-export:
    name: 🛠️ Manual Export & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: 🏗 Setup repo
      uses: actions/checkout@v4
    
    - name: 🏗 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
    
    - name: 🏗 Setup Expo and EAS
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🌐 Export Web (if selected)
      if: contains(github.event.inputs.export_type, 'web') || github.event.inputs.export_type == 'all'
      run: |
        echo "🌐 Exporting for Web..."
        npx expo export --platform web
        echo "✅ Web export completed!"
    
    - name: 📤 Upload Web Build
      if: contains(github.event.inputs.export_type, 'web') || github.event.inputs.export_type == 'all'
      uses: actions/upload-artifact@v4
      with:
        name: manual-web-build-${{ github.run_number }}
        path: dist/
        retention-days: 7
    
    - name: 🤖 Build Android (if selected)
      if: contains(github.event.inputs.export_type, 'android') || github.event.inputs.export_type == 'all'
      run: |
        echo "🤖 Building Android APK..."
        eas build --platform android --profile ${{ github.event.inputs.build_profile }} --non-interactive --wait
        
        # Download the build
        eas build:list --platform android --limit 1 --json > build_info.json
        BUILD_URL=$(cat build_info.json | jq -r '.[0].artifacts.buildUrl')
        if [ "$BUILD_URL" != "null" ]; then
          curl -L -o tn-happy-kids-manual.apk "$BUILD_URL"
          echo "✅ Android APK downloaded!"
        fi
    
    - name: 📤 Upload Android APK
      if: contains(github.event.inputs.export_type, 'android') || github.event.inputs.export_type == 'all'
      uses: actions/upload-artifact@v4
      with:
        name: manual-android-apk-${{ github.run_number }}
        path: tn-happy-kids-manual.apk
        retention-days: 7
    
    - name: 🍎 Build iOS (if selected)
      if: contains(github.event.inputs.export_type, 'ios') || github.event.inputs.export_type == 'all'
      run: |
        echo "🍎 Building iOS IPA..."
        eas build --platform ios --profile ${{ github.event.inputs.build_profile }} --non-interactive --wait
        
        # Download the build
        eas build:list --platform ios --limit 1 --json > build_info.json
        BUILD_URL=$(cat build_info.json | jq -r '.[0].artifacts.buildUrl')
        if [ "$BUILD_URL" != "null" ]; then
          curl -L -o tn-happy-kids-manual.ipa "$BUILD_URL"
          echo "✅ iOS IPA downloaded!"
        fi
    
    - name: 📤 Upload iOS IPA
      if: contains(github.event.inputs.export_type, 'ios') || github.event.inputs.export_type == 'all'
      uses: actions/upload-artifact@v4
      with:
        name: manual-ios-ipa-${{ github.run_number }}
        path: tn-happy-kids-manual.ipa
        retention-days: 7
    
    - name: 📊 Build Summary
      run: |
        echo "## 🛠️ Manual Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Export Type**: ${{ github.event.inputs.export_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Profile**: ${{ github.event.inputs.build_profile }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Run Number**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Available Artifacts:" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ github.event.inputs.export_type }}" == *"web"* ]] || [[ "${{ github.event.inputs.export_type }}" == "all" ]]; then
          echo "- 🌐 Web Build: manual-web-build-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        fi
        if [[ "${{ github.event.inputs.export_type }}" == *"android"* ]] || [[ "${{ github.event.inputs.export_type }}" == "all" ]]; then
          echo "- 🤖 Android APK: manual-android-apk-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        fi
        if [[ "${{ github.event.inputs.export_type }}" == *"ios"* ]] || [[ "${{ github.event.inputs.export_type }}" == "all" ]]; then
          echo "- 🍎 iOS IPA: manual-ios-ipa-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        fi

  create-manual-release:
    name: 📦 Create Manual Release
    runs-on: ubuntu-latest
    needs: [manual-export]
    if: github.event.inputs.create_release == 'true'
    
    steps:
    - name: 🏗 Setup repo
      uses: actions/checkout@v4
    
    - name: 📥 Download All Artifacts
      uses: actions/download-artifact@v4
    
    - name: 🏷️ Generate Release Tag
      id: tag
      run: |
        TAG="manual-v$(date +'%Y%m%d-%H%M%S')"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Generated tag: $TAG"
    
    - name: 📦 Create Manual Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: TN Happy Kids Manual Build - ${{ steps.tag.outputs.tag }}
        body: |
          ## 🛠️ Manual Build Release
          
          This is a manual build triggered by **${{ github.actor }}**
          
          ### ⚙️ Build Configuration:
          - **Export Type**: ${{ github.event.inputs.export_type }}
          - **Build Profile**: ${{ github.event.inputs.build_profile }}
          - **Build Time**: $(date)
          - **Run Number**: #${{ github.run_number }}
          
          ### 📱 TN Happy Kids Playschool App Features:
          - Multi-role authentication system
          - Beautiful gradient UI design
          - Secure session management
          - School management functionality
          
          ### 🧪 Test Credentials:
          Use these usernames with any password:
          - `admin` - Administrator access
          - `student` - Student portal
          - `teacher` - Teacher interface
          - `captain` - Captain/Attendance marker
          - `franchisee` - Franchisee management
          
          ### 📦 Installation:
          1. Download the appropriate file for your platform
          2. **Android**: Enable "Install from unknown sources" and install APK
          3. **iOS**: Use TestFlight or enterprise distribution
          4. **Web**: Extract and deploy to web server
          
          ---
          **Built with ❤️ for TN Happy Kids Playschool**
        files: |
          manual-web-build-${{ github.run_number }}/**/*
          manual-android-apk-${{ github.run_number }}/*
          manual-ios-ipa-${{ github.run_number }}/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
