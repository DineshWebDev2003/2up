name: TN Happy Kids - Expo Build & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
    - name: 🏗 Setup repo
      uses: actions/checkout@v3
    
    - name: 🏗 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: 🏗 Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🧪 Run tests
      run: npm test --passWithNoTests
    
    - name: 🚀 Publish to Expo
      run: expo publish --non-interactive
      if: github.ref == 'refs/heads/main'

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 🏗 Setup repo
      uses: actions/checkout@v3
    
    - name: 🏗 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
    
    - name: 🏗 Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🤖 Build Android APK
      run: expo build:android --type apk --non-interactive
    
    - name: 📱 Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: '*.apk'

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 🏗 Setup repo
      uses: actions/checkout@v3
    
    - name: 🏗 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
    
    - name: 🏗 Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🍎 Build iOS IPA
      run: expo build:ios --type archive --non-interactive
    
    - name: 📱 Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ios-ipa
        path: '*.ipa'

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 🏗 Setup repo
      uses: actions/checkout@v3
    
    - name: 🏗 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
    
    - name: 🏗 Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🚀 Deploy to Expo Go
      run: |
        echo "🎉 TN Happy Kids App deployed successfully!"
        echo "📱 Available on Expo Go with QR code"
        expo publish --non-interactive
    
    - name: 📧 Notify Deployment
      run: |
        echo "✅ Deployment completed for TN Happy Kids Playschool App"
        echo "🔗 Repository: ${{ github.repository }}"
        echo "📝 Commit: ${{ github.sha }}"
        echo "👤 Author: ${{ github.actor }}"
